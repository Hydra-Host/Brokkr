version: v2
plugins:
  # TypeScript message types + service descriptors for the agent.
  # Connect-ES v2 consumes the service descriptor exported from *_pb.ts
  # directly via createClient(ServiceDesc, transport); no separate
  # protoc-gen-connect-es plugin is needed.
  - local: ./node_modules/.bin/protoc-gen-es
    out: apps/live-agent/src/gen
    opt:
      - target=ts
inputs:
  - directory: proto
