# Gitleaks config — https://github.com/gitleaks/gitleaks

title = "Gitleaks Config"

[extend]
useDefault = true

[allowlist]
paths = [
  '''node_modules''',
  '''\.pnpm''',
  '''dist''',
  '''\.next''',
  '''coverage''',
  '''\.husky/_''',
  '''pnpm-lock\.yaml''',
  '''package-lock\.json''',
  # synthetic test fixtures — explicit audited roots only, NOT a blanket __test__/fixtures glob
  '''apps/api/src/brokkr-bridge/discovery/__test__/fixtures/''',
  '''apps/live-agent/src/render/__test__/fixtures/''',
  # known-answer crypto test vectors (base64, not secrets)
  '''packages/crypto/test-vectors''',
  # synthetic-credential files
  '''apps/api/src/webhook/__test__/webhook-delivery\.service\.spec\.ts''',
  # local-dev secrets (gitignored); NOT apps/api/env.sh — its history secret is tracked separately
  '''apps/api/\.env''',
]

# matched against the secret VALUE — anchored so a real key merely containing these tokens isn't suppressed
regexes = [
  '''(?i)^(example|placeholder|your[-_]?api[-_]?key|x{3,})$''',
  # documented decoy in the .env.example files, values.yaml, secretspec.toml and the self-host docs (base64 decodes to placeholder-not-for-real-use)
  '''^whsec_cGxhY2Vob2xkZXItbm90LWZvci1yZWFsLXVzZQ==$''',
]
