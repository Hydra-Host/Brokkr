SALESFORCE_API_VERSION = { default = "" }
# webvm-terminal enabled locally by default (empty → plugin stays on). Set to 'false' to hide it.
WEBVM_TERMINAL_ENABLED = { default = "" }
HYPERVISOR_ROLE_ID = { default = "" }
HYPERVISOR_DEVICE_TYPE_ID = { default = "" }
# opentelemetry off by default locally ("" = unset; @repo/telemetry drops empty OTEL_* vars)
OTEL_EXPORTER_OTLP_ENDPOINT = { default = "" }
OTEL_EXPORTER_OTLP_HEADERS = { default = "" }
OTEL_EXPORTER_OTLP_TRACES_ENDPOINT = { default = "" }
OTEL_EXPORTER_OTLP_TRACES_HEADERS = { default = "" }
