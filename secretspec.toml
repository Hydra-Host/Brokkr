# Provider-agnostic app-config secret contract — the declarative replacement for the
# `vault kv get` pulls that apps/api/env.sh used to do. devenv reads these into
# config.secretspec.secrets.*; modules/hub.nix is the sole consumer and GENERATES its per-process
# secret reads from this file's [profiles.default] key set. The spoke consumes no
# third-party app-config secrets, so only the hub is wired.
#
# [default] is the full production contract: every secret required, no defaults. It is NOT a
#   bring-up profile — hub.nix derives its per-process secret KEY SET from it; the deploy pipeline
#   resolves these from remote Vault via its own ops tasks. No `task up` activates it.
# [local] is the hermetic dev profile — every secret has a default (mostly ""), so it
#   resolves with NO provider and NO Vault auth. This is the only profile `task up` activates.
#   (These local defaults were lifted from the hub's former hardcoded values; this contract is now
#   the single source — hub.nix derives keys FROM it.)
#
# Excluded by design (not third-party app-config secrets):
#   NODE_TLS_REJECT_UNAUTHORIZED, LOG_LEVEL, IS_LOCAL, HEARTBEAT_MONITOR_ENABLED,
#     BASE_URL, NOMAD_ADDR — env posture, not secrets; stay in hub.nix (local)
#     and move to the dev/stg profile posture.

[project]
name = "brokkr-app"
revision = "1.0"

# --- Full production contract — required, no defaults --------------------------------------
[profiles.default]
# auth
BETTER_AUTH_SECRET = { description = "Better Auth signing secret", required = true }
# Rotating DEVICE_TOKEN_PEPPER invalidates every previously-issued device token (hash key changes); affected devices must re-provision.
DEVICE_TOKEN_PEPPER = { description = "Dedicated HMAC pepper for device-token hashes (rotating it invalidates all existing tokens; devices must re-provision)", required = true }
# datastores + identity (Nix-derived locally; real connection strings come from Vault in the deploy pipeline)
DATABASE_URL = { description = "Brokkr primary Postgres connection string", required = true }
PGBOUNCER_CONNECTION_STRING = { description = "PgBouncer/Hyperdrive pooled connection string", required = true }
PG_TOKEN = { description = "Cloudflare Hyperdrive token", required = true }
REDIS_URL = { description = "Redis connection string", required = true }
REDIS_CA_CERT = { description = "Path to the Redis TLS CA certificate file (PEM)", required = true }
BROKKR_ADMIN_ORG_ID = { description = "Instance-operator (admin) organization UUID. The first-boot bootstrap seeds this org as the instance operator; the app self-defaults to the all-zeros UUID when unset.", required = true }
# stripe
STRIPE_API_SECRET = { description = "Stripe secret key", required = true }
STRIPE_PMC_ID = { description = "Stripe payment method configuration id", required = true }
STRIPE_CONNECT_WEBHOOK_SECRET = { description = "Stripe Connect webhook signing secret", required = true }
STRIPE_ACCOUNT_WEBHOOK_SECRET = { description = "Stripe account webhook signing secret", required = true }
STRIPE_WEBHOOK_SECRET = { description = "Stripe webhook signing secret", required = true }
VITE_STRIPE_PUBLISHABLE_KEY = { description = "Stripe publishable key (frontend bundle)", required = true }
# s3 object storage
S3_ACCESS_KEY_ID = { description = "S3 access key id", required = true }
S3_SECRET_ACCESS_KEY = { description = "S3 secret access key", required = true }
S3_ENDPOINT_URL = { description = "S3 bucket endpoint URL", required = true }
S3_BUCKET = { description = "S3 bucket name", required = true }
# openmeter
OPENMETER_API_KEY = { description = "OpenMeter API key", required = true }
OPENMETER_WEBHOOK_SECRET = { description = "OpenMeter webhook signing secret (svix whsec_)", required = true }
# clickhouse
CLICKHOUSE_HOST = { description = "ClickHouse host (bare hostname)", required = true }
CLICKHOUSE_USER = { description = "ClickHouse username", required = true }
CLICKHOUSE_PASSWORD = { description = "ClickHouse password", required = true }
# gravwell
GRAVWELL_BASE_URL = { description = "Gravwell base URL", required = true }
GRAVWELL_API_TOKEN = { description = "Gravwell API token", required = true }
# pylon (helpdesk)
PYLON_API_TOKEN = { description = "Pylon API token", required = true }
PYLON_ACCOUNT_ID = { description = "Pylon account id", required = true }
PYLON_OPS_CONTACT_EMAIL = { description = "Requester email for Pylon system-generated tickets", required = false }
PYLON_BROKKR_HOST_TEMPLATE = { description = "Brokkr UI host template for ticket deep-links ({env} -> HH_ENV)", required = false }
PYLON_NETBOX_HOST_TEMPLATE = { description = "NetBox host template for ticket deep-links ({env} -> HH_ENV)", required = false }
# email / misc
RESEND_API_KEY = { description = "Resend API key", required = true }
SMTP_HOST = { description = "SMTP server host for outbound email", required = false }
SMTP_PORT = { description = "SMTP server port (default 587)", required = false }
SMTP_SECURE = { description = "Use implicit TLS (true for port 465, else STARTTLS)", required = false }
SMTP_USER = { description = "SMTP auth username", required = false }
SMTP_PASS = { description = "SMTP auth password", required = false }
EMAIL_FROM = { description = "Default from-address for system email", required = false }
# The blocks below configure first-party plugins that are NOT part of the public distribution. Where
# the plugin is absent these keys are inert, so outbound email stays on the SMTP_* transport above.
# email-mailgun plugin config (read by @hydrahost/plugins-config). Present → plugin enables where it
# is installed; select it as the active transport with EMAIL_PROVIDER=mailgun on the hub.
MAILGUN_API_KEY = { description = "Mailgun API key (email-mailgun plugin)", required = false }
MAILGUN_API_URL = { description = "Mailgun API base URL (email-mailgun plugin)", required = false }
MAILGUN_DOMAIN = { description = "Mailgun sending domain (email-mailgun plugin)", required = false }
MAILGUN_FROM_ADDRESS = { description = "Mailgun default from-address (email-mailgun plugin)", required = false }
# hubspot-leads plugin config (read by @hydrahost/plugins-config). All five required values
# present → plugin enables; otherwise the public inventory pages carry no lead capture.
HUBSPOT_ACCESS_TOKEN = { description = "HubSpot private-app access token (hubspot-leads plugin)", required = false }
HUBSPOT_PORTAL_ID = { description = "HubSpot portal id for Forms API submissions (hubspot-leads plugin)", required = false }
HUBSPOT_CONTACT_OWNER_ID = { description = "HubSpot owner id for new lead contacts (hubspot-leads plugin)", required = false }
HUBSPOT_FORM_ID_DEMAND_REQUEST = { description = "HubSpot demand-request form GUID (hubspot-leads plugin)", required = false }
HUBSPOT_DEMAND_REQUEST_OBJECT_TYPE_ID = { description = "HubSpot object type id for demand-request fields (hubspot-leads plugin)", required = false }
HUBSPOT_TRACKER_PORTAL_ID = { description = "HubSpot web-tracker portal id override; 'off' disables the tracker (hubspot-leads plugin)", required = false }
# salesforce-leads plugin config (read by @hydrahost/plugins-config). All three required values
# present → plugin enables; otherwise the public inventory pages carry no lead capture.
# Configure only one lead-capture plugin (salesforce-leads or hubspot-leads) at a time.
SALESFORCE_MY_DOMAIN_URL = { description = "Salesforce My Domain base URL, https://<mydomain>.my.salesforce.com (salesforce-leads plugin)", required = false }
SALESFORCE_CLIENT_ID = { description = "Salesforce connected-app consumer key for the client-credentials flow (salesforce-leads plugin)", required = false }
SALESFORCE_CLIENT_SECRET = { description = "Salesforce connected-app consumer secret (salesforce-leads plugin)", required = false }
SALESFORCE_LEAD_OWNER_ID = { description = "Salesforce user id stamped as OwnerId on created leads; empty leaves the run-as user (salesforce-leads plugin)", required = false }
SALESFORCE_API_VERSION = { description = "Salesforce REST API version override, e.g. v64.0; empty uses the plugin default (salesforce-leads plugin)", required = false }
# webvm-terminal plugin (read by @hydrahost/plugins-config). Frontend-only, no secrets, so it is
# enabled by default; set to 'false' to hide the browser Linux terminal sidebar entry.
WEBVM_TERMINAL_ENABLED = { description = "Set to 'false' to disable the WebVM Linux terminal sidebar entry (webvm-terminal plugin)", required = false }
HYPERVISOR_ROLE_ID = { description = "Hypervisor role id", required = true }
HYPERVISOR_DEVICE_TYPE_ID = { description = "Hypervisor device type id", required = true }
# opentelemetry (read pre-Nest by @repo/telemetry via apps/api/src/telemetry/init.ts).
# Endpoint set → tracing on; all empty → off. Sentry needs the per-signal TRACES vars
# (its OTLP paths are non-standard; the base endpoint appends /v1/traces and won't match).
OTEL_EXPORTER_OTLP_ENDPOINT = { description = "OTLP base endpoint (e.g. http://collector:4318); presence enables tracing", required = false }
OTEL_EXPORTER_OTLP_HEADERS = { description = "OTLP auth headers, 'key=value' comma-separated", required = false }
OTEL_EXPORTER_OTLP_TRACES_ENDPOINT = { description = "Per-signal traces endpoint, used as-is (required for Sentry: https://o<org>.ingest.sentry.io/api/<project>/integration/otlp/v1/traces)", required = false }
OTEL_EXPORTER_OTLP_TRACES_HEADERS = { description = "Per-signal traces auth headers (Sentry: 'x-sentry-auth=sentry sentry_key=<key>')", required = false }
OTEL_EXPORTER_OTLP_LOGS_ENDPOINT = { description = "Per-signal logs endpoint, used as-is (required for Sentry: .../integration/otlp/v1/logs); presence turns logs export on", required = false }
OTEL_EXPORTER_OTLP_LOGS_HEADERS = { description = "Per-signal logs auth headers (Sentry: same x-sentry-auth as traces)", required = false }
# optional — the admin OIDC entrypoint is removed pre-BoSS, so the import helper
# can't supply these and dev/stg must not require them.
# admin OIDC
ADMIN_OIDC_CLIENT_ID = { description = "Admin OIDC client id", required = false }
ADMIN_OIDC_CLIENT_SECRET = { description = "Admin OIDC client secret", required = false }
ADMIN_OIDC_TENANT_ID = { description = "Admin OIDC tenant id", required = false }
ADMIN_OIDC_AUTHORITY = { description = "Admin OIDC authority URL", required = false }
# admin-api → hub service-to-service (operator-lifecycle plugin)
HUB_OPERATOR_API_KEY = { description = "Operator-org hub API key admin-api sends as x-api-key when proxying lifecycle actions to the hub's operator-lifecycle plugin. Only the admin panel needs it.", required = false }

# --- Hermetic local profile — defaults the contract resolves under the `env` provider ------
# Resolves with NO provider. The non-empty defaults below are local-only sentinels; every
# other secret defaults to "". The derived-locally infra/identity vars default to "" as a
# sentinel — hub.nix falls back to its Nix-derived value (pgUrl / P.urls.redis /
# config.identity.orgId) when the resolved secret is empty (wired in the hub.nix refactor).
[profiles.local]
BETTER_AUTH_SECRET = { default = "local-sim-dev-better-auth-secret-do-not-use-anywhere-real" }
DEVICE_TOKEN_PEPPER = { default = "local-sim-dev-device-token-pepper-do-not-use-anywhere-real" }
OPENMETER_WEBHOOK_SECRET = { default = "whsec_cGxhY2Vob2xkZXItbm90LWZvci1yZWFsLXVzZQ==" }
CLICKHOUSE_HOST = { default = "localhost" }
# derived-locally infra/identity (sentinel "")
DATABASE_URL = { default = "" }
PGBOUNCER_CONNECTION_STRING = { default = "" }
PG_TOKEN = { default = "" }
REDIS_URL = { default = "" }
REDIS_CA_CERT = { default = "" }
BROKKR_ADMIN_ORG_ID = { default = "" }
# integration secrets — unused by sim flows
STRIPE_API_SECRET = { default = "" }
STRIPE_PMC_ID = { default = "" }
STRIPE_CONNECT_WEBHOOK_SECRET = { default = "" }
STRIPE_ACCOUNT_WEBHOOK_SECRET = { default = "" }
STRIPE_WEBHOOK_SECRET = { default = "" }
VITE_STRIPE_PUBLISHABLE_KEY = { default = "" }
S3_ACCESS_KEY_ID = { default = "" }
S3_SECRET_ACCESS_KEY = { default = "" }
S3_ENDPOINT_URL = { default = "" }
S3_BUCKET = { default = "" }
OPENMETER_API_KEY = { default = "" }
CLICKHOUSE_USER = { default = "" }
CLICKHOUSE_PASSWORD = { default = "" }
GRAVWELL_BASE_URL = { default = "" }
GRAVWELL_API_TOKEN = { default = "" }
PYLON_API_TOKEN = { default = "" }
PYLON_ACCOUNT_ID = { default = "" }
PYLON_OPS_CONTACT_EMAIL = { default = "ops@example.com" }
PYLON_BROKKR_HOST_TEMPLATE = { default = "brokkr.{env}.example.com" }
PYLON_NETBOX_HOST_TEMPLATE = { default = "netbox.{env}.example.com" }
RESEND_API_KEY = { default = "" }
# local profile: deliver to the mailpit catcher (processes.mailpit). Sentinel "" — hub.nix derives
# both from the port map, so editing ports.nix `mailpitSmtp` moves the hub's dialer along with the
# listener. The hub also sets EMAIL_LOCAL_DELIVERY=true to bypass IS_LOCAL skip.
SMTP_HOST = { default = "" }
SMTP_PORT = { default = "" }
SMTP_SECURE = { default = "false" }
SMTP_USER = { default = "" }
SMTP_PASS = { default = "" }
EMAIL_FROM = { default = "dev@brokkr.local" }
# email-mailgun disabled locally by default (empty creds → plugin auto-disables → local
# email stays on nodemailer/mailpit). Where the plugin is installed, set these + EMAIL_PROVIDER=mailgun.
MAILGUN_API_KEY = { default = "" }
MAILGUN_API_URL = { default = "" }
MAILGUN_DOMAIN = { default = "" }
MAILGUN_FROM_ADDRESS = { default = "" }
# hubspot-leads disabled locally by default (empty creds → plugin auto-disables → public
# inventory pages carry no lead capture). Fill these in to exercise it against a sandbox portal.
HUBSPOT_ACCESS_TOKEN = { default = "" }
HUBSPOT_PORTAL_ID = { default = "" }
