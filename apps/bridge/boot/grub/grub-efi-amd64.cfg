set default="0"
set timeout=5

echo 'Loading modules...'
echo 'Loading part_gpt'
insmod part_gpt
echo 'Loading fat'
insmod fat
echo 'Loading chain'
insmod chain

menuentry 'Chain load GRUB from disk' {
    echo '==============BROKKR GRUB=================='
    echo 'Attempting to boot local disk...'

    insmod search_fs_file
    for bootloader in \
            ubuntu/shimx64.efi \
            ubuntu/grubx64.efi \
            debian/shimx64.efi \
            debian/grubx64.efi \
            BOOT/BOOTX64.EFI; do
        if search --no-floppy --file --set=root /EFI/$bootloader; then
            echo "Loading OS bootloader from /EFI/$bootloader"
            chainloader /EFI/$bootloader
            boot
        fi
    done
    echo 'Failed to load OS bootloader'
    echo 'Press any key to try next boot device...'
    sleep --interruptible 10
    exit
}

menuentry 'Try next boot device' {
    echo 'Exiting GRUB and trying next boot device...'
    exit
}
