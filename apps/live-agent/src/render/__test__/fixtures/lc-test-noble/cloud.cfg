
datasource_list: [NoCloud]

datasource:
  NoCloud:
    seedfrom: file:///var/lib/cloud/seed/nocloud/
    dsmode: local

cloud_init_modules:
  - bootcmd
  - write_files
  - seed_random
  - set_hostname
  # - update_hostname
  # - update_etc_hosts
  - ca_certs
  - ntp
  - ssh
  - rsyslog
  - users_groups
  - set_passwords

cloud_config_modules:
  - locale
  - set_passwords
  - growpart
  - resizefs
  - grub_dpkg
  - apt_pipelining
  - apt-configure
  - package-update-upgrade-install
  - snap
  - timezone
  - runcmd

cloud_final_modules:
  - [phone_home, always]
  - scripts_per_once
  - scripts_per_boot
  - scripts_per_instance
  - scripts_user
  - ssh_authkey_fingerprints
  - keys_to_console
  - final-message
  - power-state-change

system_info:
  distro: ubuntu
  default_user:
    name: ubuntu
    lock_passwd: True
    gecos: Ubuntu
    groups: [adm, cdrom, dip, lxd, sudo]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
  network:
    dhcp_client_priority: [dhcpcd, dhclient, udhcpc]
    renderers: ['netplan', 'eni', 'sysconfig']
    activators: ['netplan', 'eni', 'network-manager', 'networkd']
  ntp_client: auto
  paths:
    cloud_dir: /var/lib/cloud/
    templates_dir: /etc/cloud/templates/
  package_mirrors:
    - arches: [i386, amd64]
      failsafe:
        primary: http://archive.ubuntu.com/ubuntu
        security: http://security.ubuntu.com/ubuntu
    - arches: [arm64, armel, armhf]
      failsafe:
        primary: http://ports.ubuntu.com/ubuntu-ports
        security: http://ports.ubuntu.com/ubuntu-ports
    - arches: [default]
      failsafe:
        primary: http://ports.ubuntu.com/ubuntu-ports
        security: http://ports.ubuntu.com/ubuntu-ports

ssh_deletekeys: true
ssh_genkeytypes:
  - rsa
  - ecdsa
  - ed25519

preserve_hostname: false
preserve_sources_list: false