# Pinned to the same nixpkgs-26.05 rev as flake.nix: the whole closure
# (virtualbmc/sushy-tools/pyghmi/libvirt) is validated against this pinned rev.
# allowUnfree matches flake.nix (config.allowUnfree) for the validated closure.
inputs:
  nixpkgs:
    url: github:NixOS/nixpkgs/c69ae8fb8faeb3472fd11234ba55a70ac3601f9b
  # backs the git-hooks integration (devenv/modules/dx.nix). Its hook modules + tools
  # resolve against our pinned nixpkgs, as does the prek runner devenv defaults to.
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  # backs the declarative treefmt config (devenv/treefmt-module.nix). Its formatter modules
  # resolve against our pinned nixpkgs; devenv/flake.nix evaluates the same module via
  # treefmt-nix.lib.evalModule so dev + CI run the identical formatter set.
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  # devenv injects this input implicitly when undeclared, and the implicit form tracks main.
  # Pin the release tag; devenv.nix pairs devenv.latestVersion to it.
  devenv:
    url: github:cachix/devenv/v2.2.2?dir=src/modules
allowUnfree: true
strict_ports: true

# Declarative app-config secrets (contract in secretspec.toml). The committed default is the
# hermetic `local` profile resolved by the read-only `env` provider — it falls back to the
# profile's declared defaults, so the standard dev loop needs no external secret store or Vault.
# This is the only profile `task up` activates; the deploy pipeline reads real values from remote
# Vault via its own ops tasks (nomad/terraform/backup), not through devenv.
secretspec:
  enable: true
  provider: env
  profile: local
