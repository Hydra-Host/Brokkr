{{- if not .Values.secrets.existingSecret }}
{{- $databaseUrl := include "brokkr-hub.databaseUrl" . }}
{{- $computed := list "existingSecret" "DATABASE_URL" "PGBOUNCER_CONNECTION_STRING" "REDIS_URL" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brokkr-hub.fullname" . }}
  labels:
    {{- include "brokkr-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
type: Opaque
stringData:
  DATABASE_URL: {{ $databaseUrl | quote }}
  PGBOUNCER_CONNECTION_STRING: {{ .Values.secrets.PGBOUNCER_CONNECTION_STRING | default $databaseUrl | quote }}
  REDIS_URL: {{ include "brokkr-hub.redisUrl" . | quote }}
  {{- range $key, $value := .Values.secrets }}
  {{- if not (has $key $computed) }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
