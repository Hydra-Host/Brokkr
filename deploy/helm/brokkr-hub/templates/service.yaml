apiVersion: v1
kind: Service
metadata:
  name: {{ include "brokkr-hub.fullname" . }}
  labels:
    {{- include "brokkr-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "brokkr-hub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: hub
