{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "brokkr-bridge.fullname" . }}
  labels:
    {{- include "brokkr-bridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  REDIS_URL: {{ required "config.REDIS_URL is required - the hub's Redis bus" .Values.config.REDIS_URL | quote }}
  BRIDGE_AT_REST_KEY: {{ required "secrets.BRIDGE_AT_REST_KEY is required - generate with: openssl rand -base64 32" .Values.secrets.BRIDGE_AT_REST_KEY | quote }}
{{- end }}
