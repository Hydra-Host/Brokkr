{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "brokkr-bridge.fullname" . }}-data
  labels:
    {{- include "brokkr-bridge.labels" . | nindent 4 }}
spec:
  accessModes: ['ReadWriteOnce']
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
