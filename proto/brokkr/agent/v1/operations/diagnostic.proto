// ---------------------------------------------------------------------------
// diagnostic.runAll — compound orchestrator
// ---------------------------------------------------------------------------

// Input for the diagnostic.runAll operation (parameter-free; runs all 9
// diagnostics concurrently).
message DiagnosticRunAllInput {}

// Output for the diagnostic.runAll operation.
// Flat merged record: one key per diagnostic ("gpu", "thermal", ...) plus a
// "diagnostics_metadata" tail block summarising totals, successful, failed,
// and job_id. Values are opaque JSON bytes.
message DiagnosticRunAllOutput {
  map<string, bytes> results = 1;
}
