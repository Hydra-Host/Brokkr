// diagnostic.* operations — passive hardware health diagnostics.
//
// Inputs are empty (all diagnostics are parameter-free probes). Outputs
// carry an opaque map<string, bytes> so each diagnostic can encode
// arbitrarily nested health data as JSON bytes without locking the proto
// schema. diagnostic.runAll merges all results and appends a
// `diagnostics_metadata` summary block.

syntax = "proto3";

package brokkr.agent.v1.operations;

// ---------------------------------------------------------------------------
// diagnostic.gpu
// ---------------------------------------------------------------------------

// Input for the diagnostic.gpu operation (parameter-free probe).
message DiagnosticGpuInput {}

// Output for the diagnostic.gpu operation.
// The "gpu" key holds the nested health report serialised as JSON bytes.
message DiagnosticGpuOutput {
  map<string, bytes> gpu = 1;
}

