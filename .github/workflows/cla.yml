# Blocks external PRs until the author signs cla/individual.md. Runs only on
# the public GitHub mirror; inert on GitLab.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  # actions: write lets the action re-run the failed check after a signature
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the Hydra Host Individual CLA and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT with contents:write on Hydra-Host/cla-signatures
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Hydra-Host/Brokkr/blob/master/cla/individual.md'
          remote-organization-name: 'Hydra-Host'
          remote-repository-name: 'cla-signatures'
          branch: 'main'
          custom-notsigned-comment: >
            Thank you for your contribution! Before we can merge, we ask that
            you sign the [Hydra Host Individual Contributor License
            Agreement](https://github.com/Hydra-Host/Brokkr/blob/master/cla/individual.md).
            You retain full rights to your work — the CLA grants Hydra Host a
            license to distribute and build upon it. If you are contributing
            on behalf of your employer, see the [Corporate
            CLA](https://github.com/Hydra-Host/Brokkr/blob/master/cla/corporate.md).
            To sign, reply to this pull request with the statement below.
          custom-pr-sign-comment: 'I have read the Hydra Host Individual CLA and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the Hydra Host CLA. Thank you!'
          lock-pullrequest-aftermerge: false
          # Employees (covered by employment agreements) go here. Brackets
          # escaped — unescaped [bot] is a minimatch character class.
          allowlist: 'dependabot\[bot\],renovate\[bot\],github-actions\[bot\],*\[bot\]'
